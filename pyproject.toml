[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotstock-tw"
version = "0.1.0"
description = "台股飆股候選偵測與續航評估系統（研究工具，非自動交易系統）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "requests>=2.32",
    "typer>=0.12",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
    "pandas-stubs>=2.2",
]

# wheel 只打包新系統；legacy 新聞爬蟲已依 ADR-0002 移除
[tool.hatch.build.targets.wheel]
packages = ["src/hotstock"]


# ============================================================
# 品質工具設定
#
# 掃描範圍一律只含新系統（src/hotstock、tests）。
# legacy 新聞爬蟲已依 ADR-0002 移除；歷史稽核文件不納入程式掃描。
# ============================================================

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "：", "（", "）"]

[tool.mypy]
python_version = "3.12"
files = ["src/hotstock"]
show_error_codes = true
pretty = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true

# 核心契約、來源邊界與 data layer 採 strict；模組於後續輪次建立時自動生效。
# 來源邊界處理時間、hash、lineage 與錯誤分類，是 PIT 邊界，標準不得低於 domain。
[[tool.mypy.overrides]]
module = [
    "hotstock.domain",
    "hotstock.domain.*",
    "hotstock.adapters",
    "hotstock.adapters.*",
    "hotstock.data",
    "hotstock.data.*",
]
strict = true

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
